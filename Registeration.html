<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration Form</title>
</head>

<body>

<h2 align="center">Student Event Registration Form</h2>

<form>

<table align="center" cellpadding="8">

<tr>
    <td>Student Name</td>
    <td><input type="text" name="studentname" required></td>
</tr>

<tr>
    <td>Roll Number</td>
    <td><input type="text" name="rollno" required></td>
</tr>

<tr>
    <td>Email</td>
    <td><input type="email" name="email" required></td>
</tr>

<tr>
    <td>Phone Number</td>
    <td><input type="tel" name="phone" required></td>
</tr>

<tr>
    <td>Department</td>
    <td>
        <select name="department">
            <option>Select Department</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>IT</option>
            <option>Mechanical</option>
            <option>Civil</option>
        </select>
    </td>
</tr>

<tr>
    <td>Year of Study</td>
    <td>
        <input type="radio" name="year"> I Year
        <input type="radio" name="year"> II Year
        <input type="radio" name="year"> III Year
        <input type="radio" name="year"> IV Year
    </td>
</tr>

<tr>
    <td>Event Name</td>
    <td>
        <select name="event">
            <option>Select Event</option>
            <option>Paper Presentation</option>
            <option>Poster Presentation</option>
            <option>Project Expo</option>
            <option>Technical Quiz</option>
            <option>Coding Contest</option>
        </select>
    </td>
</tr>

<tr>
    <td>Gender</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
    </td>
</tr>

<tr>
    <td>Address</td>
    <td>
        <textarea rows="4" cols="25"></textarea>
    </td>
</tr>

<tr>
    <td></td>
    <td>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </td>
</tr>

</table>

</form>

</body>
</html>
